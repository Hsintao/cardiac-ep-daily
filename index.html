<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="心脏电生理每日论文检索">
<title>心脏电生理日报</title>
<script>
/* 主题初始化：必须在样式生效前执行，避免深色用户看到白屏闪烁 */
(function () {
    try {
        var saved = localStorage.getItem('ep-digest-theme');
        if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
        }
    } catch (e) {}
})();
</script>
<style>
/* ==========================================================================
   心脏电生理每日论文检索 —— 日报样式
   自包含、无外链、无 CDN，可离线双击打开。
   设计目标：给临床医生每天读的日报，标题层级清晰、留白充足、标签配色区分亚专业。
   ========================================================================== */

:root {
    /* 主色：深青蓝（医学/电生理的冷静感），配合暖色点缀区分标签 */
    --brand: #0f766e;
    --brand-dark: #115e59;
    --brand-soft: #ccfbf1;
    --accent: #b45309;
    --accent-soft: #fef3c7;

    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-muted: #f9fafb;
    --border: #e5e7eb;
    --border-strong: #d1d5db;

    --text: #111827;
    --text-secondary: #4b5563;
    --text-tertiary: #9ca3af;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;

    /* 简约取向：用边框区分层次，不用投影。投影会让页面显得厚重、密度高。 */
    --shadow-sm: none;
    --shadow-md: none;

    /* 亚专业标签配色：每个 topic 一个色相，保证一眼可区分 */
    --t-af: #0e7490;
    --t-af-bg: #cffafe;
    --t-vt: #b91c1c;
    --t-vt-bg: #fee2e2;
    --t-device: #6d28d9;
    --t-device-bg: #ede9fe;
    --t-imaging: #0369a1;
    --t-imaging-bg: #dbeafe;
    --t-genetics: #047857;
    --t-genetics-bg: #d1fae5;
    --t-other: #4b5563;
    --t-other-bg: #e5e7eb;

    /* 语义化颜色（供深色模式统一覆盖） */
    --filter-bg: rgba(255, 255, 255, .94);
    --filter-hover: #f0fdfa;
    --focus-ring: rgba(15, 118, 110, .14);
    --warn-border: #fcd34d;
    --card-border-soft: #ccfbf1;

    --link-pubmed-bg: #eff6ff;   --link-pubmed-fg: #1d4ed8;  --link-pubmed-bd: #93c5fd;  --link-pubmed-hover: #dbeafe;
    --link-doi-bg: #f5f3ff;      --link-doi-fg: #6d28d9;     --link-doi-bd: #c4b5fd;     --link-doi-hover: #ede9fe;
    --link-pdf-bg: #fef2f2;      --link-pdf-fg: #b91c1c;     --link-pdf-bd: #fca5a5;     --link-pdf-hover: #fee2e2;

    --ai-tldr-bg: #0f766e;     --ai-tldr-fg: #fff;
    --ai-motiv-bg: #ede9fe;    --ai-motiv-fg: #5b21b6;
    --ai-method-bg: #dbeafe;   --ai-method-fg: #1e40af;
    --ai-result-bg: #d1fae5;   --ai-result-fg: #065f46;
    --ai-concl-bg: #fef3c7;    --ai-concl-fg: #92400e;

    /* 简约：页头用极浅的青色底 + 细底边，而不是大面积深色渐变 */
    --header-from: #f0fdfa;  --header-mid: #f0fdfa;  --header-to: #ecfeff;
    --header-fg: #0f172a;
    --header-accent: #0f766e;
    --header-border: #d7e7e6;

    color-scheme: light;
}

/* ==========================================================================
   深色模式
   --------------------------------------------------------------------------
   只覆盖颜色变量，排版/间距/结构完全复用浅色定义，避免两套样式各自漂移。
   触发方式两种，指向同一组变量：
     1. 跟随系统（系统切深色，页面自动跟随）
     2. 手动切换（<html data-theme="dark|light">，由页头按钮写入并 localStorage 记忆）
   手动「浅色」优先于系统深色 —— 靠 :not([data-theme="light"]) 实现。
   ========================================================================== */

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --brand: #2dd4bf;
        --brand-dark: #5eead4;
        --brand-soft: #134e4a;
        --accent: #fbbf24;
        --accent-soft: #422006;

        --bg: #0d1117;
        --surface: #161b22;
        --surface-muted: #12171e;
        --border: #262d36;
        --border-strong: #39424e;

        --text: #e6edf3;
        --text-secondary: #a5b1bd;
        --text-tertiary: #7d8895;

        /* 暗底靠边框分层，阴影几乎不可见，调淡即可 */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, .5);

        /* 亚专业标签：深色下低饱和背景 + 明亮文字，避免刺眼 */
        --t-af: #67e8f9;
        --t-af-bg: #164e63;
        --t-vt: #fca5a5;
        --t-vt-bg: #5f1d1d;
        --t-device: #c4b5fd;
        --t-device-bg: #3b2a6b;
        --t-imaging: #93c5fd;
        --t-imaging-bg: #1e3a5f;
        --t-genetics: #6ee7b7;
        --t-genetics-bg: #0f3d2e;
        --t-other: #cbd5e1;
        --t-other-bg: #2a323d;

        --filter-bg: rgba(22, 27, 34, .94);
        --filter-hover: #1b2430;
        --focus-ring: rgba(45, 212, 191, .22);
        --warn-border: #7c5a12;
        --card-border-soft: #1d3b3a;
        --link-pubmed-bg: #12233d; --link-pubmed-fg: #93c5fd; --link-pubmed-bd: #1e4a7a; --link-pubmed-hover: #183155;
        --link-doi-bg: #241a3d;    --link-doi-fg: #c4b5fd;    --link-doi-bd: #4b3a7a;    --link-doi-hover: #2f2450;
        --link-pdf-bg: #33161a;    --link-pdf-fg: #fca5a5;    --link-pdf-bd: #7a3a3a;    --link-pdf-hover: #451d24;
        --ai-tldr-bg: #0f766e;  --ai-tldr-fg: #fff;
        --ai-motiv-bg: #2b2145; --ai-motiv-fg: #c4b5fd;
        --ai-method-bg: #152a45; --ai-method-fg: #93c5fd;
        --ai-result-bg: #10352a; --ai-result-fg: #6ee7b7;
        --ai-concl-bg: #3a2c0e; --ai-concl-fg: #fcd34d;
        --header-fg: #e6edf3;
        --header-from: #101b1e;
        --header-mid: #101b1e;
        --header-to: #111d21;
        --header-accent: #2dd4bf;
        --header-border: #223037;

        color-scheme: dark;
    }
}

:root[data-theme="dark"] {
    --brand: #2dd4bf;
    --brand-dark: #5eead4;
    --brand-soft: #134e4a;
    --accent: #fbbf24;
    --accent-soft: #422006;

    --bg: #0d1117;
    --surface: #161b22;
    --surface-muted: #12171e;
    --border: #262d36;
    --border-strong: #39424e;

    --text: #e6edf3;
    --text-secondary: #a5b1bd;
    --text-tertiary: #7d8895;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, .5);

    --t-af: #67e8f9;
    --t-af-bg: #164e63;
    --t-vt: #fca5a5;
    --t-vt-bg: #5f1d1d;
    --t-device: #c4b5fd;
    --t-device-bg: #3b2a6b;
    --t-imaging: #93c5fd;
    --t-imaging-bg: #1e3a5f;
    --t-genetics: #6ee7b7;
    --t-genetics-bg: #0f3d2e;
    --t-other: #cbd5e1;
    --t-other-bg: #2a323d;

    --filter-bg: rgba(22, 27, 34, .94);
    --filter-hover: #1b2430;
    --focus-ring: rgba(45, 212, 191, .22);
    --warn-border: #7c5a12;
    --card-border-soft: #1d3b3a;
    --link-pubmed-bg: #12233d; --link-pubmed-fg: #93c5fd; --link-pubmed-bd: #1e4a7a; --link-pubmed-hover: #183155;
    --link-doi-bg: #241a3d;    --link-doi-fg: #c4b5fd;    --link-doi-bd: #4b3a7a;    --link-doi-hover: #2f2450;
    --link-pdf-bg: #33161a;    --link-pdf-fg: #fca5a5;    --link-pdf-bd: #7a3a3a;    --link-pdf-hover: #451d24;
    --ai-tldr-bg: #0f766e;  --ai-tldr-fg: #fff;
    --ai-motiv-bg: #2b2145; --ai-motiv-fg: #c4b5fd;
    --ai-method-bg: #152a45; --ai-method-fg: #93c5fd;
    --ai-result-bg: #10352a; --ai-result-fg: #6ee7b7;
    --ai-concl-bg: #3a2c0e; --ai-concl-fg: #fcd34d;
    --header-fg: #e6edf3;
    --header-from: #101b1e;
    --header-mid: #101b1e;
    --header-to: #111d21;
    --header-accent: #2dd4bf;
    --header-border: #223037;

    color-scheme: dark;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 15.5px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
}

a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------------------------------------------------------- 页头 */

.site-header {
    background: linear-gradient(180deg, var(--header-from) 0%, var(--header-to) 100%);
    color: var(--header-fg);
    padding: 26px 0 20px;
    border-bottom: 1px solid var(--header-border);
}

.wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
}

.site-header h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .3px;
}

.site-header .subtitle {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-secondary);
}

.header-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-secondary);
}

.header-meta .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--header-border);
    border-radius: 999px;
    padding: 3px 12px;
}

.header-meta .chip strong { font-weight: 700; }

.header-nav {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.header-nav a {
    color: var(--header-accent);
    font-size: 13px;
    border: 1px solid var(--header-border);
    background: var(--surface);
    border-radius: 999px;
    padding: 4px 14px;
}
.header-nav a:hover { background: var(--brand-soft); text-decoration: none; }

/* ---------------------------------------------------------------- 筛选栏 */

.filters {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--filter-bg);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
}

.filter-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
}
.filter-row:last-child { margin-bottom: 0; }

.filter-label {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: .5px;
    padding-top: 5px;
    min-width: 46px;
}

.filter-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.filter-btn {
    font: inherit;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-secondary);
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 11px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
}
.filter-btn:hover { background: var(--surface-muted); border-color: var(--border-strong); }
.filter-btn.active {
    background: var(--brand);
    border-color: var(--brand);
    /* 浅色下 brand 是深青、白字可读；深色下 brand 变亮青，需深色字才有对比度 */
    color: var(--surface);
    font-weight: 600;
}
.filter-btn .count { opacity: .65; margin-left: 3px; font-variant-numeric: tabular-nums; }

.filter-btn.more-btn {
    background: var(--surface);
    border-style: dashed;
    color: var(--brand-dark);
    font-weight: 600;
}
.filter-btn.more-btn:hover { background: var(--filter-hover); }

.search-box {
    flex: 1 1 auto;
    min-width: 180px;
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
}
.search-box:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--focus-ring);
}

.filter-empty {
    display: none;
    padding: 40px 0 60px;
    text-align: center;
    color: var(--text-secondary);
}
.filter-empty.show { display: block; }

/* ---------------------------------------------------------------- 分组 */

main { padding: 26px 0 60px; }

.topic-group { margin-bottom: 34px; }

.topic-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
}
.topic-heading .bar {
    width: 4px;
    height: 17px;
    border-radius: 2px;
    background: var(--brand);
    align-self: center;
    flex: 0 0 auto;
}
.topic-heading .topic-count {
    margin-left: auto;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
}

/* ---------------------------------------------------------------- 卡片 */

.paper-list { display: flex; flex-direction: column; gap: 14px; }

.paper-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px 16px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .18s, border-color .18s;
}
.paper-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }

.paper-card.hidden { display: none; }

.paper-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.paper-index {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--brand-soft);
    color: var(--brand-dark);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    margin-top: 3px;
}

.paper-main { flex: 1 1 auto; min-width: 0; }

.paper-title {
    margin: 0 0 8px;
    font-size: 16.5px;
    font-weight: 650;
    line-height: 1.45;
    color: var(--text);
    letter-spacing: .1px;
}
.paper-title a { color: inherit; }
.paper-title a:hover { color: var(--brand); text-decoration: none; }

/* 元信息行：期刊 · 日期 */
.paper-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
}
.paper-journal { font-weight: 600; color: var(--brand-dark); }
.paper-date { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.paper-meta .dot { color: var(--border-strong); }

/* 标签行 */
.tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
}

.tag {
    display: inline-block;
    font-size: 11.5px;
    line-height: 1.5;
    font-weight: 600;
    padding: 1px 9px;
    border-radius: 999px;
    white-space: nowrap;
}

.tag-topic { background: var(--t-other-bg); color: var(--t-other); }
.tag-topic[data-topic="房颤与消融"]   { background: var(--t-af-bg);      color: var(--t-af); }
.tag-topic[data-topic="室性心律失常"] { background: var(--t-vt-bg);      color: var(--t-vt); }
.tag-topic[data-topic="器械治疗"]     { background: var(--t-device-bg);  color: var(--t-device); }
.tag-topic[data-topic="影像与标测"]   { background: var(--t-imaging-bg); color: var(--t-imaging); }
.tag-topic[data-topic="遗传与基础"]   { background: var(--t-genetics-bg);color: var(--t-genetics); }
.tag-topic[data-topic="其他"]         { background: var(--t-other-bg);   color: var(--t-other); }

.tag-type {
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border-strong);
    font-weight: 500;
}
.tag-oa {
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--warn-border);
}

/* 作者 */
.paper-authors {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin: 0 0 12px;
    line-height: 1.6;
}

/* 摘要（可折叠） */
.abstract-block {
    border-left: 3px solid var(--border);
    padding: 2px 0 2px 12px;
    margin-bottom: 12px;
}
.abstract-block summary {
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    list-style: none;
    user-select: none;
}
.abstract-block summary::-webkit-details-marker { display: none; }
.abstract-block summary::before {
    content: "▸ ";
    color: var(--text-tertiary);
    font-size: 11px;
}
.abstract-block[open] summary::before { content: "▾ "; }
.abstract-block summary:hover { color: var(--brand); }
.abstract-body {
    margin: 8px 0 0;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.78;
    text-align: justify;
    word-break: break-word;
}
.abstract-none {
    font-size: 13px;
    color: var(--text-tertiary);
    font-style: italic;
    margin: 0;
}

/* ------------------------------------------------------- AI 中文解读 */

.ai-panel {
    background: linear-gradient(180deg, #f0fdfa 0%, var(--surface-muted) 100%);
    border: 1px solid var(--card-border-soft);
    border-radius: var(--radius-md);
    padding: 14px 16px 12px;
    margin-bottom: 12px;
}

.ai-panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--brand-dark);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 7px;
}
.ai-panel-title::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brand);
    flex: 0 0 auto;
}

.ai-section { margin-bottom: 9px; }
.ai-section:last-child { margin-bottom: 0; }

.ai-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    padding: 0 7px;
    margin-bottom: 3px;
    letter-spacing: .4px;
}
.ai-label.tldr       { background: var(--ai-tldr-bg); color: var(--ai-tldr-fg); }
.ai-label.motivation { background: var(--ai-motiv-bg); color: var(--ai-motiv-fg); }
.ai-label.method     { background: var(--ai-method-bg); color: var(--ai-method-fg); }
.ai-label.result     { background: var(--ai-result-bg); color: var(--ai-result-fg); }
.ai-label.conclusion { background: var(--ai-concl-bg); color: var(--ai-concl-fg); }

.ai-text {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.78;
    color: var(--text);
    text-align: justify;
    word-break: break-word;
}
.ai-section.tldr .ai-text {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.7;
}

/* 无 AI 解读时的降级提示 */
.ai-missing {
    font-size: 12px;
    color: var(--text-tertiary);
    margin: 0 0 12px;
    padding-left: 2px;
}

/* 链接按钮 */
.link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
}

.btn-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    background: var(--surface);
    transition: background .15s, color .15s, border-color .15s;
}
.btn-link:hover { text-decoration: none; border-color: var(--brand); color: var(--brand); background: #f0fdfa; }

<script>
/* 心脏电生理日报 —— 前端渲染
 *
 * 架构对齐参考项目 daily-arXiv-ai-enhanced：
 *   页面只是壳，选日期后 fetch 对应 JSONL 就地渲染，不跳转、不刷新。
 *
 * 数据与页面同源（都发布在 data 分支根目录），用相对路径 fetch 即可。
 * 所有论文文本必须经 escapeHtml 转义后再插入 DOM，详见 renderPaper。
 */
(function () {
    "use strict";

    var cfg = JSON.parse(document.getElementById("site-config").textContent);
    var state = { day: null, papers: [], topic: "all", journal: "all", query: "" };
    var cache = {};    // day -> papers[]，切换回来时不重复请求

    var el = {
        container: document.getElementById("paperContainer"),
        topicFilters: document.getElementById("topicFilters"),
        journalFilters: document.getElementById("journalFilters"),
        search: document.getElementById("textSearch"),
        chipDate: document.getElementById("chipDate"),
        chipTotal: document.getElementById("chipTotal"),
        chipAI: document.getElementById("chipAI"),
        chipNoAbs: document.getElementById("chipNoAbs"),
        chipNoAbsWrap: document.getElementById("chipNoAbsWrap"),
        dateToggleText: document.getElementById("dateToggleText"),
        dateToggle: document.getElementById("dateToggle"),
        datePanel: document.getElementById("datePanel"),
    };

    var TOPIC_ORDER = ["房颤与消融", "室性心律失常", "器械治疗", "影像与标测", "遗传与基础", "其他"];

    /* ---------------------------------------------------------------- 工具 */

    function escapeHtml(value) {
        if (value === null || value === undefined) { return ""; }
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    /* 链接同样要过一遍：只放行 http(s)，避免 javascript: 之类伪协议进入 href */
    function safeUrl(url) {
        if (!url) { return ""; }
        var text = String(url).trim();
        if (/^https?:\/\//i.test(text)) { return escapeHtml(text); }
        return "";
    }

    function dataUrlFor(day) {
        return "data/" + encodeURIComponent(day) + '_AI_enhanced_' + cfg.language + ".jsonl";
    }

    /* ---------------------------------------------------------- 数据加载 */

    function loadDay(day) {
        if (cache[day]) { return Promise.resolve(cache[day]); }
        return fetch(dataUrlFor(day), { cache: "no-cache" })
            .then(function (resp) {
                if (!resp.ok) { throw new Error("HTTP " + resp.status); }
                return resp.text();
            })
            .then(function (text) {
                var papers = [];
                text.split("\n").forEach(function (line) {
                    line = line.trim();
                    if (!line) { return; }
                    try {
                        var item = JSON.parse(line);
                        if (item && item.title) { papers.push(item); }
                    } catch (e) { /* 坏行跳过，不影响其它论文 */ }
                });
                papers.sort(function (a, b) {
                    var ia = TOPIC_ORDER.indexOf(a.topic);
                    var ib = TOPIC_ORDER.indexOf(b.topic);
                    if (ia !== ib) { return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); }
                    return String(a.title).localeCompare(String(b.title));
                });
                cache[day] = papers;
                return papers;
            });
    }

    /* ------------------------------------------------------------ 渲染 */

    function renderChipCounts(papers) {
        var aiCount = 0, noAbsCount = 0;
        papers.forEach(function (p) {
            if (p.AI && p.AI.tldr) { aiCount += 1; }
            if (p.no_abstract) { noAbsCount += 1; }
        });
        el.chipDate.textContent = state.day;
        el.chipTotal.textContent = papers.length;
        el.chipAI.textContent = aiCount;
        if (noAbsCount > 0) {
            el.chipNoAbs.textContent = noAbsCount;
            el.chipNoAbsWrap.hidden = false;
        } else {
            el.chipNoAbsWrap.hidden = true;
        }
    }

    function renderTopicFilters(papers) {
        var counts = {};
        papers.forEach(function (p) {
            var t = TOPIC_ORDER.indexOf(p.topic) >= 0 ? p.topic : "其他";
            counts[t] = (counts[t] || 0) + 1;
        });
        var html = '<button type="button" class="filter-btn active" data-filter-topic="all">全部 <span class="count">' +
            papers.length + "</span></button>";
        TOPIC_ORDER.forEach(function (topic) {
            if (!counts[topic]) { return; }
            html += '<button type="button" class="filter-btn" data-filter-topic="' + escapeHtml(topic) +
                '">' + escapeHtml(topic) + ' <span class="count">' + counts[topic] + "</span></button>";
        });
        el.topicFilters.innerHTML = html;
    }

    function renderJournalFilters(papers) {
        var counts = {};
        papers.forEach(function (p) {
            var j = p.journal || "未知期刊";
            counts[j] = (counts[j] || 0) + 1;
        });
        var names = Object.keys(counts).sort(function (a, b) {
            return counts[b] - counts[a] || a.localeCompare(b);
        });
        var html = '<button type="button" class="filter-btn active" data-filter-journal="all">全部</button>';
        names.forEach(function (name, index) {
            var extra = index >= 8 ? " extra-journal" : "";
            html += '<button type="button" class="filter-btn' + extra + '" data-filter-journal="' +
                escapeHtml(name) + '">' + escapeHtml(name) + ' <span class="count">' +
                counts[name] + "</span></button>";
        });
        if (names.length > 8) {
            html += '<button type="button" class="filter-btn more-btn" id="moreJournals">展开全部 ' +
                names.length + " 个期刊 ▾</button>";
        }
        el.journalFilters.innerHTML = html;
    }

    function renderAI(ai) {
        if (!ai || !ai.tldr) { return ""; }
        var sections = [
            ["tldr", "一句话结论"],
            ["motivation", "研究动机"],
            ["method", "方法"],
            ["result", "结果"],
            ["conclusion", "结论与意义"],
        ];
        var html = '<div class="ai-panel"><div class="ai-panel-head">● AI 中文解读</div>';
        sections.forEach(function (pair) {
            var key = pair[0], label = pair[1], value = ai[key];
            if (!value) { return; }
            var cls = key === "tldr" ? "ai-tldr" : "ai-section";
            html += '<div class="' + cls + '">' +
                '<span class="ai-label ' + key + '">' + escapeHtml(label) + "</span>" +
                "<p>" + escapeHtml(value) + "</p></div>";
        });
        return html + "</div>";
    }

    function renderPaper(paper, index) {
        var authors = paper.authors || [];
        var authorText = authors.slice(0, 3).join("、");
        if (authors.length > 3) {
            authorText += '<span class="authors-more"> 等 ' + authors.length + " 位作者</span>";
        }

        var meta = [];
        if (paper.journal) { meta.push('<span class="paper-journal">' + escapeHtml(paper.journal) + "</span>"); }
        if (paper.date) { meta.push('<span class="paper-date">' + escapeHtml(paper.date) + "</span>"); }
        if (paper.pmid) { meta.push('<span class="paper-date">PMID ' + escapeHtml(paper.pmid) + "</span>"); }

        var tags = '<span class="tag tag-topic" data-topic="' + escapeHtml(paper.topic || "其他") + '">' +
            escapeHtml(paper.topic || "其他") + "</span>";
        (paper.pub_types || []).slice(0, 3).forEach(function (t) {
            tags += '<span class="tag tag-type">' + escapeHtml(t) + "</span>";
        });
        if (paper.is_open_access) { tags += '<span class="tag tag-oa">开放获取</span>'; }

        var absUrl = safeUrl(paper.url || paper.abs);
        var titleHtml = absUrl
            ? '<a href="' + absUrl + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(paper.title) + "</a>"
            : escapeHtml(paper.title);

        var abstractHtml;
        if (paper.no_abstract || !(paper.summary || "").trim()) {
            abstractHtml = '<p class="abstract-none">暂无摘要（该文献可能为社论、评论或通信类文章）</p>';
        } else {
            abstractHtml = '<details class="abstract-block"><summary>英文摘要</summary><p>' +
                escapeHtml(paper.summary) + "</p></details>";
        }

        var links = "";
        if (absUrl) { links += '<a class="btn-link pubmed" href="' + absUrl + '" target="_blank" rel="noopener noreferrer">原文</a>'; }
        if (paper.doi) {
            var doiUrl = safeUrl("https://doi.org/" + paper.doi);
            if (doiUrl) { links += '<a class="btn-link doi" href="' + doiUrl + '" target="_blank" rel="noopener noreferrer">DOI</a>'; }
        }
        if (paper.pdf) {
            var pdfUrl = safeUrl(paper.pdf);
            if (pdfUrl) { links += '<a class="btn-link pdf" href="' + pdfUrl + '" target="_blank" rel="noopener noreferrer">PDF</a>'; }
        }

        var searchBlob = [paper.title, authorText, paper.summary, paper.journal]
            .join(" ").toLowerCase();

        return '<article class="paper-card"' +
            ' data-topic="' + escapeHtml(paper.topic || "其他") + '"' +
            ' data-journal="' + escapeHtml(paper.journal || "未知期刊") + '"' +
            ' data-search="' + escapeHtml(searchBlob) + '">' +
            '<div class="paper-top"><div class="paper-index">' + index + '</div>' +
            '<div class="paper-main">' +
            '<h3 class="paper-title">' + titleHtml + "</h3>" +
            '<div class="paper-meta">' + meta.join('<span class="dot">·</span>') + "</div>" +
            '<div class="tag-row">' + tags + "</div>" +
            (authorText ? '<p class="paper-authors">' + authorText + "</p>" : "") +
            abstractHtml +
            renderAI(paper.AI) +
            (links ? '<div class="paper-links">' + links + "</div>" : "") +
            "</div></div></article>";
    }

    function renderPapers() {
        var papers = state.papers;
        if (!papers.length) {
            el.container.innerHTML =
                '<div class="empty-state"><div class="icon">🗂️</div>' +
                "<h2>该日期没有论文</h2><p>" + escapeHtml(state.day) +
                " 这一天没有匹配到论文。周末与节假日尤其常见，可换一个日期查看。</p></div>";
            return;
        }
        var groups = {};
        papers.forEach(function (p) {
            var t = TOPIC_ORDER.indexOf(p.topic) >= 0 ? p.topic : "其他";
            (groups[t] = groups[t] || []).push(p);
        });
        var html = "";
        var index = 0;
        TOPIC_ORDER.forEach(function (topic) {
            var list = groups[topic];
            if (!list || !list.length) { return; }
            html += '<section class="topic-group" data-group-topic="' + escapeHtml(topic) + '">' +
                '<h2 class="topic-heading"><span class="bar"></span><span>' + escapeHtml(topic) +
                '</span><span class="topic-count">' + list.length + " 篇</span></h2>" +
                '<div class="paper-list">';
            list.forEach(function (p) {
                index += 1;
                html += renderPaper(p, index);
            });
            html += "</div></section>";
        });
        el.container.innerHTML = html;
        applyFilters();
        bindJournalToggle();
    }

    /* ------------------------------------------------------------ 筛选 */

    function applyFilters() {
        var q = state.query.trim().toLowerCase();
        var cards = el.container.querySelectorAll(".paper-card");
        var visible = 0;
        Array.prototype.forEach.call(cards, function (card) {
            var okTopic = state.topic === "all" || card.getAttribute("data-topic") === state.topic;
            var okJournal = state.journal === "all" || card.getAttribute("data-journal") === state.journal;
            var okQuery = !q || (card.getAttribute("data-search") || "").indexOf(q) >= 0;
            var show = okTopic && okJournal && okQuery;
            card.style.display = show ? "" : "none";
            if (show) { visible += 1; }
        });
        // 整组都被筛掉时隐藏组标题，避免出现空标题
        var sections = el.container.querySelectorAll(".topic-group");
        Array.prototype.forEach.call(sections, function (section) {
            var any = false;
            Array.prototype.forEach.call(section.querySelectorAll(".paper-card"), function (c) {
                if (c.style.display !== "none") { any = true; }
            });
            section.style.display = any ? "" : "none";
        });
        var emptyNote = document.getElementById("filterEmptyNote");
        if (visible === 0 && cards.length > 0) {
            if (!emptyNote) {
                emptyNote = document.createElement("div");
                emptyNote.id = "filterEmptyNote";
                emptyNote.className = "empty-state";
                emptyNote.innerHTML = '<div class="icon">🔍</div><h2>没有匹配的论文</h2>' +
                    "<p>试试清除筛选条件或换一个关键词。</p>";
                el.container.appendChild(emptyNote);
            }
            emptyNote.hidden = false;
        } else if (emptyNote) {
            emptyNote.hidden = true;
        }
    }

    function bindJournalToggle() {
        var btn = document.getElementById("moreJournals");
        if (!btn) { return; }
        var extras = el.journalFilters.querySelectorAll(".extra-journal");
        Array.prototype.forEach.call(extras, function (b) { b.style.display = "none"; });
        btn.addEventListener("click", function () {
            var open = btn.getAttribute("data-open") === "1";
            Array.prototype.forEach.call(extras, function (b) {
                b.style.display = open ? "none" : "";
            });
            btn.setAttribute("data-open", open ? "0" : "1");
            btn.textContent = open
                ? "展开全部 " + extras.length + " 个期刊 ▾"
                : "收起期刊列表 ▴";
        });
    }

    /* -------------------------------------------------------- 日期切换 */

    function setActiveDayCell(day) {
        el.datePanel.querySelectorAll(".date-cell").forEach(function (cell) {
            var on = cell.getAttribute("data-day") === day;
            cell.classList.toggle("current", on);
            cell.setAttribute("aria-selected", on ? "true" : "false");
        });
        el.dateToggleText.textContent = day;
    }

    function switchDay(day, options) {
        options = options || {};
        if (!day) { return; }
        state.day = day;
        state.topic = "all";
        state.journal = "all";
        state.query = "";
        el.search.value = "";
        setActiveDayCell(day);
        if (options.updateHash !== false && window.history && history.replaceState) {
            history.replaceState(null, "", "#" + day);
        }
        el.container.innerHTML =
            '<div class="loading-state"><div class="loading-spinner"></div><p>正在加载 ' +
            escapeHtml(day) + " 的论文…</p></div>";
        loadDay(day).then(function (papers) {
            state.papers = papers;
            renderChipCounts(papers);
            renderTopicFilters(papers);
            renderJournalFilters(papers);
            renderPapers();
        }).catch(function (err) {
            el.container.innerHTML =
                '<div class="empty-state"><div class="icon">⚠️</div><h2>加载失败</h2>' +
                "<p>" + escapeHtml(day) + " 的数据读取失败：" + escapeHtml(err.message) +
                '。请检查该日期的数据文件是否已发布。</p></div>';
        });
    }

    /* ------------------------------------------------------------ 绑定 */

    function initDatePicker() {
        el.dateToggle.addEventListener("click", function (event) {
            event.stopPropagation();
            var open = el.datePanel.hidden;
            el.datePanel.hidden = !open;
            el.dateToggle.setAttribute("aria-expanded", open ? "true" : "false");
            if (open) {
                var cur = el.datePanel.querySelector(".date-cell.current");
                if (cur && cur.scrollIntoView) { cur.scrollIntoView({ block: "nearest" }); }
            }
        });
        el.datePanel.addEventListener("click", function (event) {
            var cell = event.target.closest(".date-cell");
            if (cell) {
                event.stopPropagation();
                el.datePanel.hidden = true;
                el.dateToggle.setAttribute("aria-expanded", "false");
                switchDay(cell.getAttribute("data-day"));
                return;
            }
            event.stopPropagation();
        });
        document.addEventListener("click", function () {
            if (!el.datePanel.hidden) {
                el.datePanel.hidden = true;
                el.dateToggle.setAttribute("aria-expanded", "false");
            }
        });
        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && !el.datePanel.hidden) {
                el.datePanel.hidden = true;
                el.dateToggle.setAttribute("aria-expanded", "false");
                el.dateToggle.focus();
            }
        });
        var latest = document.getElementById("jumpLatest");
        if (latest) {
            latest.addEventListener("click", function (event) {
                event.stopPropagation();
                el.datePanel.hidden = true;
                switchDay(cfg.days[0]);
            });
        }
    }

    function initFilters() {
        el.topicFilters.addEventListener("click", function (event) {
            var btn = event.target.closest("[data-filter-topic]");
            if (!btn) { return; }
            el.topicFilters.querySelectorAll(".filter-btn").forEach(function (b) {
                b.classList.remove("active");
            });
            btn.classList.add("active");
            state.topic = btn.getAttribute("data-filter-topic");
            applyFilters();
        });
        el.journalFilters.addEventListener("click", function (event) {
            var btn = event.target.closest("[data-filter-journal]");
            if (!btn) { return; }
            el.journalFilters.querySelectorAll("[data-filter-journal]").forEach(function (b) {
                b.classList.remove("active");
            });
            btn.classList.add("active");
            state.journal = btn.getAttribute("data-filter-journal");
            applyFilters();
        });
        el.search.addEventListener("input", function () {
            state.query = el.search.value;
            applyFilters();
        });
    }

    function initTheme() {
        var btn = document.getElementById("themeToggle");
        if (!btn) { return; }
        var root = document.documentElement;
        var mql = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
        function current() {
            var manual = root.getAttribute("data-theme");
            if (manual === "dark" || manual === "light") { return manual; }
            return (mql && mql.matches) ? "dark" : "light";
        }
        function label() {
            var manual = root.getAttribute("data-theme");
            var suffix = manual ? "" : "（跟随系统）";
            btn.textContent = (current() === "dark" ? "☀️ 浅色" : "🌙 深色") + suffix;
        }
        btn.addEventListener("click", function () {
            var next = current() === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            try { localStorage.setItem("ep-digest-theme", next); } catch (e) {}
            label();
        });
        label();
    }

    function init() {
        initDatePicker();
        initFilters();
        initTheme();
        // 支持用 #YYYY-MM-DD 直达某一天（可分享、刷新不丢）
        var fromHash = (location.hash || "").replace("#", "");
        var initial = cfg.days.indexOf(fromHash) >= 0 ? fromHash : cfg.defaultDate;
        switchDay(initial, { updateHash: false });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();

</script>
</body>
</html>
