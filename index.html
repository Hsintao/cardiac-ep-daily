<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="心脏电生理每日论文检索">
<title>心脏电生理日报</title>
<script>
/* 主题初始化：必须在样式生效前执行，避免深色用户看到白屏闪烁 */
(function () {
    try {
        var saved = localStorage.getItem('ep-digest-theme');
        if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
        }
    } catch (e) {}
})();
</script>
<style>
/* ==========================================================================
   心脏电生理每日论文检索 —— 日报样式
   自包含、无外链、无 CDN，可离线双击打开。

   视觉语言对齐参考项目 daily-arXiv-ai-enhanced：
     - 主色调为紫蓝渐变（#667eea → #764ba2），浅色底 #fafbff，白色卡片；
     - 12px 圆角 + 极轻紫调投影，hover 上浮 2px 并加深阴影；
     - 顶栏 sticky + backdrop-filter 毛玻璃。
   只改视觉层（颜色 / 圆角 / 阴影 / 字体 / 过渡），类名与布局结构保持不变。

   主题切换：
     1. @media (prefers-color-scheme: dark) —— 跟随系统；
     2. :root[data-theme="dark"] / [data-theme="light"] —— 手动切换，由页头按钮
        写入 <html data-theme> 并用 localStorage 记忆。
   两套深色规则都只覆盖颜色变量，排版/结构复用浅色定义，避免两套样式漂移。
   ========================================================================== */

/* ------------------------------------------------------------ 设计令牌 */

:root {
    /* 主色梯度 */
    --primary-color: #667eea;
    --secondary-color: #764ba2;
    --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-soft: linear-gradient(135deg, #eef2ff 0%, #f5f0ff 100%);

    /* 中性色 */
    --bg: #fafbff;
    --surface: #ffffff;
    --surface-muted: #f8f9ff;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    --text: #1e293b;
    --text-secondary: #475569;
    --text-tertiary: #64748b;

    /* 圆角 */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 12px;

    /* 阴影（紫调、极轻） */
    --shadow-sm: 0 1px 3px rgba(102, 126, 234, 0.1);
    --shadow-md: 0 4px 15px rgba(102, 126, 234, 0.15);
    --shadow-lg: 0 8px 24px rgba(102, 126, 234, 0.2);
    --shadow-btn: 0 2px 6px rgba(102, 126, 234, 0.25);
    --shadow-btn-hover: 0 4px 12px rgba(102, 126, 234, 0.35);

    /* 过渡 */
    --transition: all 0.2s ease;

    /* 主题相关的表面/控件令牌（保证深色下可整体覆盖） */
    --header-bg: rgba(255, 255, 255, 0.8);
    --header-fg: #1e293b;
    --header-accent: #667eea;
    --header-border: rgba(226, 232, 240, 0.9);
    --filter-bg: rgba(250, 251, 255, 0.85);
    --focus-ring: rgba(102, 126, 234, 0.22);
    --hover-surface: #f1f5f9;
    --scrollbar-thumb: rgba(102, 126, 234, 0.28);
    --scrollbar-thumb-hover: rgba(102, 126, 234, 0.45);
    --code-bg: #f1f5f9;
    --primary-tint: #eef2ff;
    --primary-tint-strong: #e0e7ff;
    --primary-contrast: #ffffff; /* 渐变/主色块上的文字色 */

    /* 标签：期刊、开放获取、作者 */
    --accent-color: #6d2dad;
    --oa-bg: #fff7ed;
    --oa-fg: #b45309;
    --oa-bd: #fed7aa;
    --author-color: #047857;

    /* 亚专业标签：6 色，环绕紫—蓝—青—绿—琥珀展开，保证一眼可区分 */
    --t-af: #0e7490;        --t-af-bg: #e0f2fe;        --t-af-bd: #a5d8ea;
    --t-vt: #be123c;        --t-vt-bg: #ffe4e9;        --t-vt-bd: #fbc4cf;
    --t-device: #6d28d9;    --t-device-bg: #efe7ff;    --t-device-bd: #d3c4f5;
    --t-imaging: #1d4ed8;   --t-imaging-bg: #e0e8ff;   --t-imaging-bd: #b8c8f7;
    --t-genetics: #047857;  --t-genetics-bg: #d9f8ee;  --t-genetics-bd: #a3e6cd;
    --t-other: #475569;     --t-other-bg: #eef1f6;     --t-other-bd: #d8dfe9;

    /* 链接按钮（PubMed / DOI / 原文 / PDF） */
    --link-pubmed-bg: #eef2ff; --link-pubmed-fg: #4338ca; --link-pubmed-bd: #c7d2fe; --link-pubmed-hover: #e0e7ff;
    --link-doi-bg: #f5f0ff;    --link-doi-fg: #6d28d9;    --link-doi-bd: #ddd0fb;    --link-doi-hover: #ece2ff;
    --link-pdf-bg: #fff1f3;    --link-pdf-fg: #be123c;    --link-pdf-bd: #fbc4cf;    --link-pdf-hover: #ffe4e9;
    --link-src-bg: #ffffff;    --link-src-fg: #475569;    --link-src-bd: #cbd5e1;    --link-src-hover: #f4f6ff;

    /* AI 解读面板：tldr 用主渐变强调，其余沿用语义色但换成柔和紫调 */

    --ai-tldr-fg: #ffffff;
    --ai-motiv-bg: #f3e8ff;  --ai-motiv-fg: #6b21a8;
    --ai-method-bg: #e0e7ff; --ai-method-fg: #3730a3;
    --ai-result-bg: #d9f8ee; --ai-result-fg: #065f46;
    --ai-concl-bg: #fef3c7;  --ai-concl-fg: #92400e;

/* ------------------------------------------------------------ 基础 */

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    /* 字体全部用系统字体栈，不引入外部字体 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15.5px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

a { color: var(--primary-color); text-decoration: none; }
a:hover { text-decoration: underline; }

::selection { background: rgba(102, 126, 234, 0.22); }

/* 滚动条 —— 跟随主题令牌 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background-color: var(--scrollbar-thumb);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
    background-color: var(--scrollbar-thumb-hover);
    background-clip: content-box;
}

/* ------------------------------------------------------------ 页头 */

/* 顶栏不吸顶：它本身很高（标题 + 日期 + 统计），钉在屏幕上会一直吞掉正文。
   吸顶的位置留给更常用的筛选栏（见下方 .filters，滚动时它才是始终需要的）。
   z-index 仍需保留：日期下拉面板要盖住吸顶的筛选栏。 */
.site-header {
    position: relative;
    z-index: 100;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    backdrop-filter: saturate(180%) blur(10px);
    color: var(--header-fg);
    padding: 18px 0 14px;
    border-bottom: 1px solid var(--header-border);
}

.wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px;
}

.site-header h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: .3px;
    /* 标题用主渐变做文字填充，呼应参考项目的 site-title */
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--primary-color); /* 不支持 background-clip 的旧内核回退 */
    width: fit-content;
}

.site-header .subtitle {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-secondary);
}

.header-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-secondary);
}

.header-meta .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 12px;
    box-shadow: var(--shadow-sm);
    line-height: 1.5;
}

.header-meta .chip strong {
    font-weight: 700;
    color: var(--primary-color);
    font-variant-numeric: tabular-nums;
}

.chip[hidden] { display: none; }

.header-nav {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

.header-nav a {
    color: var(--header-accent);
    font-size: 13px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 4px 14px;
    transition: var(--transition);
}
.header-nav a:hover {
    background: var(--primary-tint);
    border-color: var(--primary-color);
    text-decoration: none;
}

/* ------------------------------------------------------------ 筛选栏 */

/* 筛选栏吸顶：顶栏已随页面滚走，这里 top:0 不会再被压在下面。
   手机端屏幕更小（<=640px），改回随页面滚走，见文件末尾的媒体查询。 */
.filters {
    position: sticky;
    top: 0;
    z-index: 90;
    background: var(--filter-bg);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
}

/* 矮屏（手机横屏、小窗口）的规则统一放在文件末尾，避免被后面的基础样式覆盖。 */

.filter-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
}
.filter-row:last-child { margin-bottom: 0; }

.filter-label {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: .5px;
    padding-top: 5px;
    min-width: 46px;
}

.filter-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.filter-btn {
    font: inherit;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 11px;
    cursor: pointer;
    transition: var(--transition);
}
.filter-btn:hover {
    background: var(--primary-tint);
    border-color: var(--primary-color);
    color: var(--primary-color);
}
.filter-btn.active {
    background: var(--gradient-primary);
    border-color: transparent;
    /* 渐变块上固定用白字：深浅两套主题下渐变本身不变，对比度恒定 */
    color: #ffffff;
    font-weight: 600;
    box-shadow: var(--shadow-btn);
}
.filter-btn.active:hover { box-shadow: var(--shadow-btn-hover); color: #ffffff; }
.filter-btn .count { opacity: .8; margin-left: 3px; font-variant-numeric: tabular-nums; }

.filter-btn.more-btn {
    background: var(--surface);
    border-style: dashed;
    border-color: var(--border-strong);
    color: var(--primary-color);
    font-weight: 600;
}
.filter-btn.more-btn:hover { background: var(--primary-tint); border-color: var(--primary-color); }

/* 期刊过多时的浮层：展开后不再把筛选栏撑高，论文区不会被挤出屏幕。
   以前是把所有期刊就地铺开，吸顶的筛选栏会越撑越高，最后连「收起」
   按钮都被挤出屏幕，上下滑动也看不到论文。
   浮层挂在整条筛选栏下面（而不是压在「检索」行上），左右与内容区对齐，
   这样打开时不会挡住搜索框。 */
.journal-more-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: max(24px, calc((100% - 980px) / 2 + 24px));
    right: max(24px, calc((100% - 980px) / 2 + 24px));
    z-index: 95;
    max-height: min(50vh, 320px);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 10px;
}
.journal-more-panel[hidden] { display: none; }

.journal-more-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

/* 选中的期刊可能收在浮层里，浮层关掉后靠左侧标签提示当前筛选 */
#journalFilterLabel {
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.filter-label-active { color: var(--primary-color); font-weight: 700; }

.search-box {
    flex: 1 1 auto;
    min-width: 180px;
    font: inherit;
    font-size: 13px;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    transition: var(--transition);
}
.search-box::placeholder { color: var(--text-tertiary); }
.search-box:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px var(--focus-ring);
}

.filter-empty {
    display: none;
    padding: 40px 0 60px;
    text-align: center;
    color: var(--text-secondary);
}
.filter-empty.show { display: block; }

/* ------------------------------------------------------------ 分组 */

main { padding: 26px 0 60px; }

.topic-group { margin-bottom: 34px; }

.topic-heading {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .2px;
}
.topic-heading .bar {
    width: 4px;
    height: 17px;
    border-radius: 999px;
    background: var(--gradient-primary);
    align-self: center;
    flex: 0 0 auto;
}
.topic-heading .topic-count {
    margin-left: auto;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------ 论文卡片 */

.paper-list {
    /* 两列网格（参考项目用的是 auto-fill + minmax，这里按需求固定两列）。
       卡片高度不一致，用 align-items:start 防止同一行被拉齐留白。 */
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    align-items: start;
}

/* 窄屏 / 平板竖屏回落单列：两列在 <900px 时标题会挤成三行，反而更难读 */
@media (max-width: 900px) {
    .paper-list { grid-template-columns: minmax(0, 1fr); }
}

.paper-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 20px 16px;
    box-shadow: var(--shadow-sm);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.paper-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--primary-tint-strong);
    transform: translateY(-2px);
}

.paper-card.hidden { display: none; }

.paper-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

.paper-index {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--gradient-primary);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
    margin-top: 3px;
    box-shadow: var(--shadow-btn);
}

.paper-main { flex: 1 1 auto; min-width: 0; }

.paper-title {
    margin: 0 0 8px;
    font-size: 16.5px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    letter-spacing: .1px;
}
.paper-title a { color: inherit; transition: color .15s ease; }
.paper-title a:hover { color: var(--primary-color); text-decoration: none; }

/* 元信息行：期刊 · 日期 · PMID */
.paper-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
}
.paper-journal { font-weight: 600; color: var(--secondary-color); }
.paper-date { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.paper-meta .dot { color: var(--border-strong); }

/* 标签行 */
.tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
}

.tag {
    display: inline-block;
    font-size: 11.5px;
    line-height: 1.6;
    font-weight: 600;
    padding: 1px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
}

/* 亚专业标签：6 个色相，浅色为淡底深字，深色为深底亮字（见主题令牌） */
.tag-topic {
    background: var(--t-other-bg);
    color: var(--t-other);
    border-color: var(--t-other-bd);
}
.tag-topic[data-topic="房颤与消融"]   { background: var(--t-af-bg);       color: var(--t-af);       border-color: var(--t-af-bd); }
.tag-topic[data-topic="室性心律失常"] { background: var(--t-vt-bg);       color: var(--t-vt);       border-color: var(--t-vt-bd); }
.tag-topic[data-topic="器械治疗"]     { background: var(--t-device-bg);   color: var(--t-device);   border-color: var(--t-device-bd); }
.tag-topic[data-topic="影像与标测"]   { background: var(--t-imaging-bg);  color: var(--t-imaging);  border-color: var(--t-imaging-bd); }
.tag-topic[data-topic="遗传与基础"]   { background: var(--t-genetics-bg); color: var(--t-genetics); border-color: var(--t-genetics-bd); }
.tag-topic[data-topic="其他"]         { background: var(--t-other-bg);    color: var(--t-other);    border-color: var(--t-other-bd); }

.tag-type {
    background: var(--surface-muted);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    font-weight: 500;
}
.tag-oa {
    background: var(--oa-bg);
    color: var(--oa-fg);
    border: 1px solid var(--oa-bd);
}

/* 作者 */
.paper-authors {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin: 0 0 12px;
    line-height: 1.6;
}

/* 作者折叠提示：弱化处理，避免与正文争视觉权重 */
.authors-more { color: var(--author-color); font-style: normal; }

/* 摘要（可折叠） */
.abstract-block {
    border-left: 3px solid var(--primary-tint-strong);
    padding: 4px 0 4px 12px;
    margin-bottom: 12px;
}
.abstract-block summary {
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-secondary);
    list-style: none;
    user-select: none;
    transition: color .15s ease;
}
.abstract-block summary::-webkit-details-marker { display: none; }
.abstract-block summary::before {
    content: "▸ ";
    color: var(--primary-color);
    font-size: 11px;
}
.abstract-block[open] summary::before { content: "▾ "; }
.abstract-block summary:hover { color: var(--primary-color); }
.abstract-body {
    margin: 8px 0 0;
    font-size: 13.5px;
    color: var(--text-secondary);
    line-height: 1.78;
    text-align: justify;
    word-break: break-word;
}
.abstract-none {
    font-size: 13px;
    color: var(--text-tertiary);
    font-style: italic;
    margin: 0 0 12px;
}

/* 中文摘要（AI 翻译）：与英文摘要同款折叠块，用左侧竖线颜色稍作区分；
   提示语比正文更弱，只在展开后出现，避免两列布局下显得臃肿。 */
.abstract-zh { border-left-color: var(--secondary-color); }
.abstract-zh summary::before { color: var(--secondary-color); }
.abstract-zh summary:hover { color: var(--secondary-color); }
.abstract-zh-note {
    margin: 8px 0 0;
    font-size: 11.5px;
    color: var(--text-tertiary);
    font-style: italic;
    line-height: 1.6;
}
.abstract-zh-note + p { margin: 4px 0 0; }

/* ------------------------------------------------------------ AI 中文解读 */

.ai-panel {
    background: var(--gradient-soft);
    border: 1px solid var(--primary-tint-strong);
    border-radius: var(--radius-md);
    padding: 14px 16px 12px;
    margin-bottom: 12px;
    margin-top: 0;
    box-shadow: var(--shadow-sm);
}

.ai-panel-head {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .8px;
    color: var(--secondary-color);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 7px;
}
.ai-panel-head::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gradient-primary);
    flex: 0 0 auto;
}

/* 一句话结论：用主渐变底 + 白字做整段强调 */
.ai-tldr {
    background: var(--ai-tldr-bg);
    color: var(--ai-tldr-fg);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-btn);
}
.ai-tldr .ai-label {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
}
.ai-tldr p {
    margin: 6px 0 0;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.7;
    color: inherit;
}

.ai-section { margin-bottom: 9px; }
.ai-section:last-child { margin-bottom: 0; }
.ai-section + .ai-section { margin-top: 0; }

.ai-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 0 9px;
    margin-bottom: 4px;
    letter-spacing: .4px;
    line-height: 1.7;
}
.ai-label.tldr       { background: var(--ai-tldr-bg); color: var(--ai-tldr-fg); }
.ai-label.motivation { background: var(--ai-motiv-bg); color: var(--ai-motiv-fg); }
.ai-label.method     { background: var(--ai-method-bg); color: var(--ai-method-fg); }
.ai-label.result     { background: var(--ai-result-bg); color: var(--ai-result-fg); }
.ai-label.conclusion { background: var(--ai-concl-bg); color: var(--ai-concl-fg); }

.ai-text,
.ai-section p {
    margin: 4px 0 0;
    font-size: 13.5px;
    line-height: 1.78;
    color: var(--text);
    text-align: justify;
    word-break: break-word;
}
.ai-section.tldr .ai-text {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.7;
}

/* 无 AI 解读时的降级提示 */
.ai-missing {
    font-size: 12px;
    color: var(--text-tertiary);
    margin: 0 0 12px;
    padding-left: 2px;
}

/* ------------------------------------------------------------ 链接按钮 */

.link-row,
.paper-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
}

.btn-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 13px;
    border-radius: 999px;
    border: 1px solid var(--link-src-bd);
    color: var(--link-src-fg);
    background: var(--link-src-bg);
    transition: var(--transition);
}
.btn-link:hover {
    text-decoration: none;
    border-color: var(--primary-color);
    color: var(--primary-color);
    background: var(--primary-tint);
    transform: translateY(-1px);
}
.btn-link.pubmed { border-color: var(--link-pubmed-bd); color: var(--link-pubmed-fg); background: var(--link-pubmed-bg); }
.btn-link.pubmed:hover { background: var(--link-pubmed-hover); border-color: var(--link-pubmed-fg); }
.btn-link.doi { border-color: var(--link-doi-bd); color: var(--link-doi-fg); background: var(--link-doi-bg); }
.btn-link.doi:hover { background: var(--link-doi-hover); border-color: var(--link-doi-fg); }
.btn-link.pdf { border-color: var(--link-pdf-bd); color: var(--link-pdf-fg); background: var(--link-pdf-bg); }
.btn-link.pdf:hover { background: var(--link-pdf-hover); border-color: var(--link-pdf-fg); }
.btn-link.source { border-color: var(--link-src-bd); color: var(--link-src-fg); background: var(--link-src-bg); }
.btn-link.source:hover { background: var(--link-src-hover); border-color: var(--primary-color); color: var(--primary-color); }

/* ------------------------------------------------------------ 加载 / 空状态 */

.loading-state {
    text-align: center;
    padding: 64px 0;
    color: var(--text-secondary);
}
.loading-state p { margin: 12px 0 0; font-size: 14px; }

.loading-spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border: 3px solid var(--primary-tint-strong);
    border-top-color: var(--primary-color);
    border-radius: 50%;
    animation: ep-spin .8s linear infinite;
}
@keyframes ep-spin { to { transform: rotate(360deg); } }

.empty-state {
    background: var(--surface);
    border: 1px dashed var(--empty-bd);
    border-radius: var(--radius-md);
    padding: 56px 24px;
    margin: 20px 0;
    text-align: center;
    color: var(--text-secondary);
    box-shadow: var(--shadow-sm);
}
.empty-state .icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
.empty-state h2 { margin: 0 0 10px; font-size: 18px; font-weight: 650; color: var(--text); }
.empty-state p { margin: 0 auto; max-width: 560px; font-size: 14px; line-height: 1.75; }
.empty-state .hint {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--text-tertiary);
}
.empty-state code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1px 6px;
    font-size: 12px;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* ------------------------------------------------------------ 往期导航（兼容旧结构） */

.archive-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.archive-list li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
}
.archive-list li:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.archive-list .topic-pill {
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 999px;
    padding: 1px 9px;
    background: var(--t-other-bg);
    color: var(--t-other);
    white-space: nowrap;
    margin-top: 2px;
}
.archive-list .a-title { flex: 1 1 auto; font-size: 14px; min-width: 0; line-height: 1.55; }
.archive-list .a-journal {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--text-tertiary);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
}
.archive-list .a-actions {
    flex: 0 0 auto;
    font-size: 12px;
    white-space: nowrap;
    margin-top: 2px;
}

.archive-nav {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--header-border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    font-size: 13px;
}

.archive-nav-label {
    color: var(--text-tertiary);
    white-space: nowrap;
}

.archive-nav-days,
.archive-nav-all {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.archive-nav a {
    color: var(--header-accent);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-variant-numeric: tabular-nums;
    transition: var(--transition);
}
.archive-nav a:hover {
    background: var(--primary-tint);
    border-color: var(--primary-color);
    text-decoration: none;
}
.archive-nav a.current {
    background: var(--gradient-primary);
    border-color: transparent;
    color: #ffffff;
    font-weight: 600;
}

.archive-more {
    font: inherit;
    font-size: 13px;
    color: var(--header-accent);
    background: transparent;
    border: 1px dashed var(--border-strong);
    border-radius: 999px;
    padding: 2px 10px;
    cursor: pointer;
    transition: var(--transition);
}
.archive-more:hover { background: var(--primary-tint); border-color: var(--primary-color); }

.archive-nav-all {
    flex-basis: 100%;
    margin-top: 4px;
}

/* hidden 必须显式压到 display:none —— 作者样式里的 display:flex 会覆盖
   [hidden] 自带的 display:none，导致「收起」状态其实没藏住。 */
.archive-nav-all[hidden] { display: none; }
/* 展开时用 class 切换，比 hidden 属性更稳（display:flex 会覆盖 [hidden]） */
.archive-nav.expanded .archive-nav-days { display: none; }

/* ------------------------------------------------------------ 日期选择器 */

.date-bar {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--header-border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
}

.date-bar-label { color: var(--text-tertiary); }

.date-bar-hint { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

.date-select { position: relative; }

.date-toggle {
    font: inherit;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--header-accent);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 132px;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
}
.date-toggle:hover { background: var(--primary-tint); border-color: var(--primary-color); }
.date-toggle:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring);
    border-color: var(--primary-color);
}
.date-toggle-text { font-weight: 600; }
.date-toggle-caret { color: var(--text-tertiary); font-size: 11px; }

.date-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 120;
    width: 340px;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 12px;
}
.date-panel[hidden] { display: none; }

.date-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-tertiary);
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border);
}
.date-panel-body { display: block; }
.date-panel-latest {
    font: inherit;
    font-size: 12px;
    color: var(--primary-color);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
}
.date-panel-latest:hover { text-decoration: underline; }

.date-month + .date-month { margin-top: 10px; }

.date-month-label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 6px;
}

.date-month-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}

.date-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 30px;
    font: inherit;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-secondary);
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
}
.date-cell:hover {
    background: var(--primary-tint);
    border-color: var(--primary-color);
    color: var(--primary-color);
    text-decoration: none;
}
.date-cell.current {
    background: var(--gradient-primary);
    color: #ffffff;
    font-weight: 700;
    border-color: transparent;
    box-shadow: var(--shadow-btn);
}

/* -------------------------------------------------- 日期区间模式（单日 / 区间） */

/* 顶栏按钮里的区间天数徽标（默认 hidden，切到区间后由 JS 显示「7 天」） */
.date-toggle-count {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text-tertiary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}
/* 作者样式里的 display 会覆盖 [hidden] 自带的 display:none，必须显式压回 */
.date-toggle-count[hidden] { display: none; }

/* 面板头部：「单日 / 区间」分段控件 */
.date-mode-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
    padding: 2px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
}

.date-mode-btn {
    font: inherit;
    font-size: 11.5px;
    line-height: 1.5;
    font-weight: 500;
    padding: 1px 10px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--text-secondary);
    white-space: nowrap;
    cursor: pointer;
    transition: var(--transition);
}
.date-mode-btn:hover { color: var(--primary-color); background: var(--primary-tint); }
.date-mode-btn.active {
    background: var(--primary-tint);
    color: var(--primary-color);
    font-weight: 600;
}
.date-mode-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring);
}

/* 区间工具条：默认 hidden，切到「区间」后由 JS 显示 */
.date-range-bar {
    display: block;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 12px;
}
/* display:block 会覆盖 [hidden] 的 display:none，必须显式写 */
.date-range-bar[hidden] { display: none; }

.date-range-hint {
    margin: 0 0 6px;
    color: var(--text-secondary);
    line-height: 1.5;
}

.date-range-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
}

/* 快捷区间 / 清除：小号 pill 按钮 */
.date-range-preset,
.date-range-clear {
    font: inherit;
    font-size: 11.5px;
    line-height: 1.5;
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    white-space: nowrap;
    cursor: pointer;
    transition: var(--transition);
}
.date-range-preset:hover,
.date-range-clear:hover {
    background: var(--primary-tint);
    border-color: var(--primary-color);
    color: var(--primary-color);
}
.date-range-preset:focus-visible,
.date-range-clear:focus-visible {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px var(--focus-ring);
}
.date-range-clear { margin-left: auto; color: var(--text-secondary); }

/* 区间内的日期格：主色 tint 背景 + 主色边框，整体弱于起止端点 */
.date-cell.in-range {
    background: var(--primary-tint);
    color: var(--primary-color);
    border-color: var(--primary-color);
    font-weight: 500;
}

/* 起止端点：与单日选中（.current）同一套渐变强调 */
.date-cell.range-start,
.date-cell.range-end {
    background: var(--gradient-primary);
    color: #ffffff; /* 渐变上的文字与 .date-cell.current 一致，不随主题翻转 */
    font-weight: 700;
    border-color: transparent;
    box-shadow: var(--shadow-btn);
}

/* 预览态：已点起点、尚未点终点时的临时高亮，用虚线边框与 in-range 区分 */
.date-cell.preview {
    background: var(--primary-tint-strong);
    color: var(--primary-color);
    border: 1px dashed var(--primary-color);
    font-weight: 600;
}

/* 卡片 tag-row 内的「覆盖日期」小标签（区间聚合时标注论文所属日期） */
.tag-day {
    display: inline-block;
    font-size: 11px;
    line-height: 1.6;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface-muted);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* 区间部分日期加载失败的提示条：复用 OA 淡橙令牌，深浅色都保证可读 */
.load-warning {
    margin-bottom: 12px;
    padding: 8px 12px;
    border: 1px solid var(--oa-bd);
    border-radius: var(--radius-sm);
    background: var(--oa-bg);
    color: var(--oa-fg);
    font-size: 13px;
    line-height: 1.6;
}

/* 手机上：区间天数徽标缩小、工具条正常换行（面板宽度沿用既有规则） */
@media (max-width: 640px) {
    .date-toggle-count { font-size: 11px; }
    .date-range-actions { gap: 4px; }
    .date-mode-btn { padding: 1px 8px; }
}

/* ------------------------------------------------------------ 页脚 */

.site-footer {
    margin-top: 48px;
    padding: 24px 0 40px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--text-tertiary);

}
.site-footer p { margin: 0 0 5px; }
.site-footer p:last-child { margin-bottom: 0; }

/* ------------------------------------------------------------ 主题切换按钮 */

.theme-toggle {
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    color: var(--primary-color);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 14px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
}
.theme-toggle:hover {
    background: var(--primary-tint);
    border-color: var(--primary-color);
    box-shadow: var(--shadow-btn);
}
/* 与统计 chip 同一行时垂直居中、字重一致 */
.header-meta .theme-toggle { align-self: center; }
.theme-toggle:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--focus-ring);
    border-color: var(--primary-color);
}

/* ------------------------------------------------------------ 响应式 */

@media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    .site-header { padding: 16px 0 12px; }
    .site-header h1 { font-size: 19px; }
    .paper-card { padding: 14px 15px 13px; }

    .paper-title { font-size: 15.5px; }
    .paper-index { display: none; }

    main { padding: 18px 0 44px; }
}

/* 减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
    }
    .paper-card:hover,
    .archive-list li:hover,
    .btn-link:hover { transform: none; }
}

/* ------------------------------------------------------------ 打印 */

@media print {
    :root,
    :root[data-theme="dark"],

/* ==========================================================================
   卡片结构（对齐参考项目：header + content 两段式块状卡片）
   --------------------------------------------------------------------------
   序号从「左侧竖排」改为「标题前圆形徽标」，标题占据第一视觉权重。
   ========================================================================== */

.paper-card-header {
    padding: 16px 18px 0;
}

.paper-head-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
}

.paper-head-row .paper-index {
    margin-top: 2px;
}

.paper-card-header .paper-title {
    margin: 0;
    flex: 1 1 auto;
    min-width: 0;
}

.paper-card-header .paper-meta {
    margin: 8px 0 0 36px;   /* 与标题左缘对齐（让出徽标宽度） */
}

.paper-card-content {
    padding: 12px 18px 16px;
}

.paper-card-content > .tag-row {
    margin-bottom: 10px;
}

@media (max-width: 640px) {
    .paper-card-header .paper-meta { margin-left: 0; }
}

/* ==========================================================================
   顶栏布局（对齐参考项目的 header-content：左标识 / 右控件 / 下沿统计）
   ========================================================================== */

.header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    padding-top: 16px;
    padding-bottom: 12px;
    flex-wrap: wrap;
}

.header-left { min-width: 0; }

.site-logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}
.site-logo:hover { text-decoration: none; }

.logo-mark {
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: var(--gradient-primary);
    color: #ffffff;
    font-size: 17px;
    line-height: 1;
    box-shadow: var(--shadow-sm);
}

.site-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .2px;
    background: var(--gradient-primary);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: var(--text-color);
}

.header-left .subtitle {
    margin: 6px 0 0 44px;   /* 与标题文字左缘对齐（让出 logo 宽度+间距） */
    font-size: 13px;
    color: var(--text-secondary);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.date-toggle-icon { font-size: 13px; line-height: 1; }

/* 统计 chip 区：贴顶栏下沿，与筛选栏之间用细线分隔 */
.header-stats {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
}

.header-stats .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12.5px;
    color: var(--text-secondary);
}

/* .header-stats .chip 的 display:inline-flex 会覆盖 [hidden] 自带的 display:none，
   导致「覆盖 N 天」「无摘要」等按需出现的 chip 在隐藏状态下仍然显示。显式压回。 */
.header-stats .chip[hidden] { display: none; }

.header-stats .chip strong {
    font-weight: 700;
    color: var(--primary-color);
    font-variant-numeric: tabular-nums;
}

@media (max-width: 720px) {
    .header-top { gap: 12px; }
    .header-left .subtitle { margin-left: 0; }
    .site-title { font-size: 17px; }
}

/* ---------------------------------------------------------------- 补充结构 */

/* 检索行：与主题/期刊行共用 .filter-row 的对齐方式 */
.filter-row-search { align-items: center; }

/* 卡片底部：链接按钮区，与内容之间用分隔线隔开 */
.paper-card-footer {
    padding: 12px 18px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    flex-wrap: wrap;
}

/* 论文列表容器 */
.paper-container { display: grid; }

/* ==========================================================================
   AI 解读折叠区
   --------------------------------------------------------------------------
   一句话结论常驻显示（最重要的信息）；动机/方法/结果/结论收进 <details>。
   用原生 details/summary，不依赖 JS，键盘可操作、屏幕阅读器可识别。
   ========================================================================== */

.ai-details {
    margin-top: 10px;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
}

.ai-details-summary {
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--primary-color);
    padding: 6px 0;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
}
.ai-details-summary::-webkit-details-marker { display: none; }
.ai-details-summary::before {
    content: "▸";
    font-size: 10px;
    transition: transform .18s ease;
    color: var(--text-tertiary);
}
.ai-details[open] > .ai-details-summary::before {
    transform: rotate(90deg);
}
.ai-details-summary:hover { color: var(--secondary-color); }

.ai-details-body {
    padding-top: 10px;
    animation: ai-expand .18s ease;
}
@keyframes ai-expand {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: none; }
}

/* 折叠区展开后，段落左缘与一句话结论对齐，视觉不突兀 */
.ai-details-body .ai-section p { margin-top: 4px; }

@media (prefers-reduced-motion: reduce) {
    .ai-details-summary::before { transition: none; }
    .ai-details-body { animation: none; }
}

/* ==========================================================================
   移动端（<= 640px）
   --------------------------------------------------------------------------
   实测（390x844）：旧样式顶栏 210px + 筛选区 316px = 526px，首屏就被占掉
   62%；360x640 更是 549px / 86%。而且两者都是 sticky，往下读论文时一直压在
   正文上面 —— 这就是「下滑时标题和期刊名占大半个屏」的来源。

   目标：手机上把屏幕让给论文内容。
     · 顶栏、筛选区都不再 sticky，随页面滚走，下滑时正文独占全屏；
     · 首屏高度压缩：副标题 / emoji 隐藏，控件与统计 chip 缩小；
     · 主题 / 期刊按钮改成单行横向滑动，不再换行堆成一大片；
     · 期刊不再折叠：手机上直接横向滑动查看全部，避免「展开全部」按钮
       被样式藏掉后点了却没反应。
   ========================================================================== */

@media (max-width: 640px) {

    /* ---------- 1) 顶栏：跟随页面滚走（基础样式不再吸顶，这里只压缩高度） ---------- */
    .site-header { padding: 10px 0 8px; }

    .header-top { padding-top: 0; padding-bottom: 6px; gap: 8px; }
    .site-logo { gap: 8px; }
    .logo-mark { width: 28px; height: 28px; font-size: 14px; border-radius: 8px; }
    .site-title { font-size: 16px; }
    .header-left .subtitle { display: none; }   /* 副标题在手机上纯占地方 */

    .header-right { gap: 8px; }
    .date-toggle { padding: 5px 10px; font-size: 12.5px; min-width: 0; }
    .date-toggle-icon { display: none; }         /* emoji 在部分机型显示异常，手机上省掉 */
    .theme-toggle { padding: 5px 10px; font-size: 12.5px; }

    /* 统计 chip 压成一行小字 */
    .header-stats { padding-bottom: 2px; gap: 6px; font-size: 11.5px; }
    .header-stats .chip { padding: 2px 9px; font-size: 11.5px; }

    /* ---------- 2) 筛选区：同样滚走，单行横向滑动 ---------- */
    .filters { position: static; padding: 8px 0; }

    .filter-row {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
    }
    .filter-row:last-child { margin-bottom: 0; }

    /* 小标签（主题/期刊/检索）内联在左侧，不再单独占一行 */
    .filter-label {
        display: inline-flex;
        flex: 0 0 auto;
        min-width: 0;
        font-size: 11px;
        padding-top: 0;
    }

    .filter-buttons {
        flex: 1 1 auto;
        min-width: 0;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 6px;
        padding-bottom: 1px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .filter-buttons::-webkit-scrollbar { display: none; }

    .filter-btn {
        flex: 0 0 auto;          /* 不压缩，靠横向滚动 */
        white-space: nowrap;
        font-size: 12px;
        padding: 3px 10px;
    }

    /* 手机上期刊不折叠：「展开全部」按钮直接隐掉，浮层摊平成一行，
       全部期刊都在这条横向滑动列表里 */
    .filter-btn.more-btn { display: none !important; }
    .journal-more-panel,
    .journal-more-panel[hidden] { display: contents; }
    .journal-more-grid { display: contents; }
    #journalFilterLabel { max-width: 84px; }

    /* 检索框矮一些 */
    .search-box { font-size: 13px; padding: 6px 12px; min-width: 0; }

    /* ---------- 3) 内容区：更紧凑 ---------- */
    .topic-heading { margin: 16px 0 8px; font-size: 15px; }

    .paper-card-header { padding: 14px 15px 0; }
    .paper-card-content { padding: 10px 15px 12px; }
    .paper-card-footer { padding: 10px 15px 12px; }
    .paper-card-header .paper-title { font-size: 15px; line-height: 1.45; }
    /* 序号徽标在手机上已隐藏，期刊/日期行与标题左缘对齐 */
    .paper-card-header .paper-meta { margin-left: 0; font-size: 12px; }

    .paper-card .tag-row { margin-bottom: 8px; gap: 5px; }
    .paper-card .tag { font-size: 11px; padding: 1px 8px; }

    .paper-authors { font-size: 12px; margin-bottom: 8px; }

    /* AI 面板收紧 */
    .ai-panel { padding: 10px 12px; margin-top: 10px; }
    .ai-tldr p { font-size: 13.5px; line-height: 1.65; }
}

/* ==========================================================================
   矮屏（手机横屏、小窗口：高度 <= 620px 且宽度 > 640px）
   --------------------------------------------------------------------------
   这种屏幕下顶栏 + 三行筛选本来就能吃掉整屏，筛选栏再吸顶更是雪上加霜。
   这里改为随页面滚走，并把主题/期刊压成单行横向滑动（和手机端一致），
   期刊全部平铺、不再需要「展开全部」浮层。
   注意必须放在文件末尾：否则会被前面同名的 filter 基础样式覆盖。
   ========================================================================== */

@media (max-height: 620px) and (min-width: 641px) {
    .filters { position: static; }

    .filter-row { flex-wrap: nowrap; align-items: center; }
    .filter-buttons {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    .filter-buttons::-webkit-scrollbar { display: none; }
    .filter-btn { flex: 0 0 auto; white-space: nowrap; }

    /* 期刊全部平铺到横向列表里，不再需要「展开全部」浮层 */
    .filter-btn.more-btn { display: none !important; }
    .journal-more-panel,
    .journal-more-panel[hidden] { display: contents; }
    .journal-more-grid { display: contents; }
}
